<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Trình phát</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    p { color: #fff; font: 15px system-ui, sans-serif; text-align: center; padding: 40px 16px; }
  </style>
</head>
<body>
<script>
  // Trang phát video YouTube dùng cho bản app iOS: nhúng được vì trang này có địa chỉ https hợp lệ.
  // Dùng: player.html?v=<mã video 11 ký tự>
  (function () {
    var id = new URLSearchParams(location.search).get('v') || '';
    if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
      document.body.innerHTML = '<p>Không tìm thấy video.</p>';
      return;
    }
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + id +
      '?autoplay=1&playsinline=1&rel=0&modestbranding=1&origin=' + encodeURIComponent(location.origin);
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.title = 'Video';
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
