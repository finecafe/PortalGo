<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1b2e" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Cà Mau Portal - Xem video của Cổng thông tin điện tử tỉnh Cà Mau">
  <title>Cà Mau Portal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cà Mau Portal">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Bộ biểu tượng -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.8 4.8 0 0 1 8-3.5A4.8 4.8 0 0 1 20 10c0 5.8-8 11-8 11z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.5 4 7.5 12l8 8 1.5-1.5L10.5 12 17 5.5z"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.3 1.1L8.9 13.7a3 3 0 0 0 0-3.4l6.8-3.4A3 3 0 1 0 15 5a3 3 0 0 0 .1.8L8.3 9.2a3 3 0 1 0 0 5.6l6.8 3.4A3 3 0 1 0 18 16z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm1 4v4.6l3.5 2.1-.8 1.3L11 12.4V7z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 4.6 6 6 6-6L19.4 6l-6 6 6 6-1.4 1.4-6-6-6 6L4.6 18l6-6-6-6z"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-8.3 8.3-1.4-1.4L17.6 5H14zM5 6h6v2H6v10h10v-5h2v7H4V6z"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2s5 4.3 5 9.5a5 5 0 0 1-10 0c0-1.6.6-2.9 1.4-3.9.2 1.2.9 2 1.9 2.2C9.5 6.7 12 2 12 2zm0 20a6 6 0 0 1-6-6c0-.7.1-1.3.4-1.9 1 1.3 2.2 1.9 3.6 1.9 0-1.5 1.2-3 2-3.8 1.6 1.7 4 3 4 5.8A6 6 0 0 1 12 22z"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 0-1z"/></symbol>
      <symbol id="i-chip" viewBox="0 0 24 24"><path d="M9 2h2v3h2V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v2h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-2v3H9v-3H7a1 1 0 0 1-1-1v-2H3v-2h3v-2H3V9h3V6a1 1 0 0 1 1-1h2zm-1 5v10h8V7z"/></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 7V6a6 6 0 0 1 12 0v1h2l1 14H3L4 7zm2 0h8V6a4 4 0 0 0-8 0z"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3 6.5 7 .8-5.2 4.8 1.4 7L12 17.600 5.800 21l1.400-7L2 9.300l7-.8z"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 2h2v2h12l-2.500 5 2.500 5H7v8H5z"/></symbol>
      <symbol id="i-news" viewBox="0 0 24 24"><path d="M4 4h13a1 1 0 0 1 1 1v3h2a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1zm2 3v2h9V7zm0 4v2h9v-2zm0 4v2h6v-2zm12-5v7h1v-7z"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.800 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></symbol>
      <symbol id="i-vote" viewBox="0 0 24 24"><path d="M4 14h16l1 7H3zM9 3l7 7-4 4-7-7zm8.500 8.500L19 10l2 2-1.500 1.500z"/></symbol>
    </defs>
  </svg>

  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btn-back" aria-label="Quay lại" hidden>
      <svg class="ic"><use href="#i-back"/></svg>
    </button>
    <a class="brand" href="#/home" aria-label="Cà Mau Portal - Trang chủ">
      <img src="assets/logo.png" alt="" width="40" height="36">
      <span class="brand-text"><b>Cà Mau</b> <span>Portal</span></span>
    </a>
    <h1 class="page-title" id="page-title" hidden></h1>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-search" aria-label="Tìm kiếm">
      <svg class="ic"><use href="#i-search"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Điều hướng chính">
    <a href="#/home" data-tab="home"><svg class="ic"><use href="#i-home"/></svg><span>Trang chủ</span></a>
    <a href="#/news" data-tab="news"><svg class="ic"><use href="#i-news"/></svg><span>Tin tức</span></a>
    <a href="#/tourism" data-tab="tourism"><svg class="ic"><use href="#i-pin"/></svg><span>Du lịch</span></a>
    <a href="#/categories" data-tab="categories"><svg class="ic"><use href="#i-grid"/></svg><span>Video</span></a>
    <a href="#/favorites" data-tab="favorites"><svg class="ic"><use href="#i-heart"/></svg><span>Đã lưu</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
